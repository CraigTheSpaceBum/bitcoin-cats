name = "bitcoin-cats-platform-viewers"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true
preview_urls = false

# The Worker is the origin for this dedicated hostname; the main GitHub Pages
# website and its apex DNS records are left untouched.
[[routes]]
pattern = "api.bitcoin-cats.ca"
custom_domain = true

# Private OAuth state, Twitch access/refresh tokens and EventSub chat history.
[[kv_namespaces]]
binding = "TWITCH_AUTH"
id = "00a6e41cb8d448948baaf89f80c0a74d"
