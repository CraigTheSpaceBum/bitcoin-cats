<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090910">
  <meta name="description" content="Support Bitcoin Cats with a Bitcoin donation.">
  <title>Donate · Bitcoin Cats</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}

    main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:100vh;min-height:100dvh}
    iframe{display:block;width:100%;height:calc(100vh - 48px);height:calc(100dvh - 48px);min-height:320px;border:0;background:#090910}
    .donation-help{margin:0;padding:10px 16px;text-align:center;color:#a4a3b8;font-size:12px;line-height:1.4}
    .donation-help a{color:#ffd1a0}
  </style>
</head>
<body>
  <main id="main-content" aria-label="Bitcoin Cats donation checkout">
    <iframe title="Bitcoin Cats donation checkout" src="https://zap.bitcoin-cats.ca/i/QU4a17WGBWBaCCAt3nbkLt/BTC-CHAIN" allow="payment; clipboard-write; fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p class="donation-help">Checkout not loading? <a href="https://zap.bitcoin-cats.ca/i/QU4a17WGBWBaCCAt3nbkLt/BTC-CHAIN" target="_blank" rel="noopener noreferrer">Open Bitcoin Cats donations</a></p>
  </main>
</body>
</html>
