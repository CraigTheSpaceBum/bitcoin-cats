<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bitcoin Cats</title>
  <meta name="description" content="Personal blog powered by Nostr (read-only feed).">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-overlay: rgba(0,0,0,0.6);
      --text:#f3f3f6;
      --muted:#b0b0ba;
      --border:#2c2c3c;
      --orange:#ffa447;
      --orange-2:#ff7a1a;
      --card-bg: rgba(20,20,28,0.65);
      --quote-bg: rgba(40,40,52,0.5);
      --shadow: 0 6px 20px rgba(0,0,0,0.45);
      --play-bg: rgba(0,0,0,0.5);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;scroll-behavior:smooth;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    body{
      color:var(--text);
      background: var(--bg-overlay) url('https://bitcoin-cats.ca/BackgroundLoop.webp') center center / cover no-repeat fixed;
      background-blend-mode: darken;
      overflow-x:hidden;
    }
    a{color:#ffd099;text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:1680px;margin:0 auto;padding:20px}

    /* NEW: Banner */
    header.profile{
      position:relative;
      margin:30px 0 30px 0;
      animation:fadeIn 1.5s ease;
    }
    .banner{
      position:relative;
      width:100%;
      border:1px solid rgba(255,180,120,0.25);
      background:
        linear-gradient(90deg, rgba(255,164,71,0.35), rgba(255,122,26,0.20) 45%, rgba(255,164,71,0.18));
      backdrop-filter: blur(4px);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:22px 22px 22px 120px; /* space for overlapping pfp */
      min-height:120px;
      overflow:visible;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .pfp-wrap{
      position:absolute;
      left:-28px; top:50%;
      transform:translateY(-50%);
      width:140px; height:140px;
    }
    .pfp-wrap img{
      width:140px; height:140px; border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,164,71,0.6);
      box-shadow:0 10px 30px rgba(0,0,0,0.55);
    }
    .id-block{
      display:flex; flex-direction:column; gap:8px;
    }
    .id-name{
      font-size:1.9rem; font-weight:900; color:#ffe0c2; text-shadow:0 2px 10px rgba(0,0,0,0.35);
    }
    .id-npub{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:0.95rem; color:#ffe0c2; opacity:0.85;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(255,200,150,0.25);
      padding:4px 10px; border-radius:999px;
      max-width:100%;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .actions{
      margin-left:auto;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .btn{
      border:1px solid rgba(255,200,150,0.25);
      background:linear-gradient(180deg, rgba(25,18,12,0.8), rgba(20,14,10,0.8));
      color:#ffd9b3;
      padding:9px 14px; border-radius:999px; font-weight:800; cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s ease, filter .15s ease;
      user-select:none;
    }
    .btn:hover{filter:brightness(1.12)}
    .btn:active{transform:scale(0.98)}
    .btn.ghost{background:transparent}
    .followers-badge{
      display:inline-flex; align-items:center; gap:6px;
    }

    /* Loading overlay */
    .loading-overlay{
      position:fixed; inset:0; display:grid; place-items:center; z-index:99;
      background: radial-gradient(800px 400px at 20% -10%, rgba(255,122,26,0.12), transparent 60%) no-repeat,
                  radial-gradient(900px 500px at 110% 120%, rgba(255,164,71,0.10), transparent 60%) no-repeat,
                  rgba(5,5,8,0.9);
      transition: opacity .6s ease, visibility .6s ease;
    }
    .loading-overlay.hidden{opacity:0; visibility:hidden;}
    .loading-text{
      font-family: "Press Start 2P", monospace;
      color:#ffb77a; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,122,26,0.5);
      animation: flicker 1.3s infinite;
    }
    @keyframes flicker{0%,100%{opacity:1}50%{opacity:0.55}}

    main.feed{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap:24px;
      padding-bottom:100px;
    }
    article.post{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      min-height:480px;
      opacity:0;
      transform:translateY(20px);
      transition:opacity 0.8s ease, transform 0.8s ease;
    }
    article.post.visible{opacity:1;transform:translateY(0)}
    .post-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .pfp{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}

    .name{font-weight:800;color:var(--orange)}
    .time{font-size:13px;color:var(--muted)}

      white-space:pre-wrap;
      font-size:15px;line-height:1.55;margin-top:4px;
      /* NEW: keep super-long tokens from breaking the card */
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .gallery{margin-top:6px;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;flex:1;min-height:160px}
    .gallery.single{min-height:0; height:100%;}
    .gallery::-webkit-scrollbar{height:8px}
    .gallery::-webkit-scrollbar-thumb{background:#333;border-radius:999px}
    .media-box{
      background:#0b0b12; border:1px solid var(--border); border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      min-width:260px; max-width:100%; height:220px; flex-shrink:0; position:relative; overflow:hidden;
    }
    .gallery.single .media-box{height:100%; min-width:0; width:100%}
    .media-box img{max-height:100%; max-width:100%; object-fit:contain; display:block}
    .play-overlay{
      position:absolute; inset:0; display:grid; place-items:center; background:var(--play-bg);
      opacity:1; transition:opacity .2s ease; cursor:pointer;
      font-weight:800; color:#ffd9b3; border:1px dashed rgba(255,255,255,0.15);
    }
    .play-overlay:hover{opacity:1}
    .quote{
      background:var(--quote-bg);
      border-left:3px solid var(--orange);
      border-radius:12px;
      padding:10px 14px;
      margin-top:10px;
    }
    .quote-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .quote-header img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .quote-name{font-size:13px;font-weight:700;color:var(--orange)}
    .quote-text{font-size:14px;color:var(--muted);white-space:pre-wrap;line-height:1.4;}
    .mention{
      display:inline-flex; align-items:center; gap:6px; padding:2px 6px; border-radius:999px;
      background: rgba(255,164,71,0.08); border:1px solid rgba(255,164,71,0.25);
      margin:0 2px; opacity:0; transform:translateY(4px);
      transition:opacity .4s ease, transform .4s ease;
      /* NEW: never let badges overflow */
      max-width:220px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      vertical-align:middle;
    }
    .mention.visible{opacity:1; transform:translateY(0);}
    .mention img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .mention .label{
      color:var(--orange); font-weight:700; font-size:13px;
      /* NEW: clamp the text inside the badge */
      max-width:170px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      display:inline-block;
    }
    footer{color:var(--muted);font-size:12px;text-align:center;padding:40px 0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  
    .about-page {
      animation: fadeIn 0.8s ease forwards;
      border-radius: 0;
      padding: 10px;
      box-shadow: none;
      border: none;
      color: var(--text);
      min-height: 10vh;
    }

    .about-page.hidden {
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modern blog refresh */
    body{background:radial-gradient(ellipse at 10% 0%,rgba(255,164,71,.10),transparent 35%),linear-gradient(rgba(5,5,9,.90),rgba(5,5,9,.94)),url('BackgroundLoop.webp') center/cover fixed}
    .container{max-width:1440px;padding:clamp(14px,2.5vw,32px)}
    .banner{background:linear-gradient(135deg,rgba(25,25,39,.96),rgba(18,18,28,.94));border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:24px 24px 24px 130px;backdrop-filter:blur(18px)}
    .id-name{font-family:system-ui,sans-serif;font-size:clamp(1.5rem,3vw,2.15rem);letter-spacing:-.04em;color:#f8f5ff}
    .id-npub{color:#c5c1d5;background:rgba(0,0,0,.24);border-color:rgba(255,255,255,.1);font-size:.78rem}
    .btn{font-family:inherit;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#f3f0fa;border-radius:12px;padding:10px 14px;box-shadow:none;font-weight:700;transition:transform .15s,border-color .15s,background .15s}
    .btn:hover{background:rgba(255,164,71,.10);border-color:rgba(255,164,71,.45);transform:translateY(-1px)}
    .btn.primary{background:linear-gradient(135deg,#ffb45f,#ff842e);color:#241507;border-color:transparent}
    main.feed{grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:18px;padding:8px 0 80px}
    article.post{min-height:0;padding:20px;background:linear-gradient(155deg,rgba(22,22,34,.96),rgba(13,13,22,.97));border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.24);opacity:1;transform:none;transition:border-color .2s,transform .2s}
    article.post:hover{border-color:rgba(255,164,71,.28);transform:translateY(-2px)}
    .post-header{padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px}
    .pfp{width:44px;height:44px}
    .name{color:#ffb76c;font-size:14px}
    .time{font-size:12px;margin-top:3px}
    .content{font-size:15px;line-height:1.8;color:#e9e6f2;margin:4px 0 12px}
    .gallery{flex:none;min-height:0;margin:10px 0}
    .media-box{border-radius:14px;border-color:rgba(255,255,255,.1)}
    .post-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
    .post-action{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#d9d5e5;font:600 12px system-ui,sans-serif;cursor:pointer}
    .post-action:hover,.post-action.active{color:#ffd19e;border-color:rgba(255,164,71,.45);background:rgba(255,164,71,.09)}
    .post-action:disabled{opacity:.5;cursor:not-allowed}
    .post-interactions{margin-top:12px}
    .comment-list{display:grid;gap:9px;margin:10px 0}
    .comment-item{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
    .comment-author{font-size:12px;font-weight:750;color:#ffb76c;margin-bottom:4px}
    .comment-body{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
    .comment-form{display:flex;gap:8px;margin-top:10px}
    .comment-input{min-width:0;flex:1;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:11px 12px;color:var(--text);font:13px system-ui,sans-serif;outline:none}
    .comment-input:focus{border-color:rgba(255,164,71,.6)}
    .interaction-note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}
    .blog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px}
    .blog-heading{font-size:clamp(22px,3vw,30px);font-weight:850;letter-spacing:-.04em}
    .blog-subtitle{font-size:13px;color:var(--muted);margin-top:6px}
    @media(max-width:700px){.container{padding:12px}.banner{padding:84px 14px 16px;align-items:flex-start;flex-direction:column;gap:14px}.pfp-wrap{left:14px;top:-22px;transform:none;width:84px;height:84px}.pfp-wrap img{width:84px;height:84px;border-width:3px}.id-name{font-size:1.5rem}.actions{margin:0;gap:7px}.btn{padding:9px 10px;font-size:12px}.post-actions{gap:6px}.post-action{padding:8px}.comment-form{flex-direction:column}.comment-form .btn{align-self:flex-end}}

  </style>

<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <center>
        <div class="loading-text">LOADING…</div>
        <img src="catstr.gif" alt="Loading Cat" class="loading-cat">
      </center>
    </div>

  <div class="container">
    <header class="profile" id="profileHeader">
      <div class="banner">
        <div class="pfp-wrap">
          <img id="pfp" alt="Profile Picture">
        </div>
        <div class="id-block">
          <div class="id-name" id="profName">Loading…</div>
          <div class="id-npub" id="profNpub">npub…</div>
        </div>

          <button class="btn primary" id="homeBtn">✍️ Blog</button>

          <button class="btn" id="loginBtn" type="button">🔑 Login with Nostr</button>
        </div>
      </div>
    </header>

    <section class="blog-toolbar"><div><div class="blog-heading">The Blog</div><div class="blog-subtitle">Long-form thoughts, notes, and conversations from Nostr.</div></div><span class="tag" id="blogStatus">Read-only · Sign in to interact</span></section>
    <main class="feed" id="feed"></main>
  </div>

<script>
const API = "https://api.nostr.wine/search";
const PUBKEY_HEX = "3ab4c8ea97cd164d17f68990c1006e21e87f31a919a7013ecf2dae2e416938fd";
const DEFAULT_LIMIT = 100;
const feedEl = document.getElementById("feed");
const overlay = document.getElementById("loadingOverlay");

/* ---------- Utils ---------- */
function humanTime(ts){return new Date(ts*1000).toLocaleString();}
function linkify(text){
  const urlRe=/(https?:\/\/[^\s]+)/g;
  return text.replace(urlRe,(u)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}
function extractImages(text){
  const imgRe=/(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/gi;
  return [...text.matchAll(imgRe)].map(m=>m[0]);
}
function extractVideos(text){
  const vidRe=/(https?:\/\/[^\s]+\.(mp4|webm|mov))/gi;
  return [...text.matchAll(vidRe)].map(m=>m[0]);
}
function extractLive(text){
  const list = [];
  const urlRe=/(https?:\/\/[^\s]+)/g;
  (text.match(urlRe)||[]).forEach(u=>{
    if(u.includes("zap.stream") || u.includes("nostr.build/live")) list.push(u);
  });
  return list;
}
function findNevent(text){
  const m = text.match(/nostr:nevent1[0-9a-z]+/i);
  return m ? m[0] : null;
}
function findAllNprofiles(text){
  return text.match(/nostr:nprofile1[0-9a-z]+/ig) || [];
}
function stripMediaAndNevent(text){
  let t = text.replace(/https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp|mp4|webm|mov)/gi, '');
  t = t.replace(/https?:\/\/(?:zap\.stream|nostr\.build\/live)[^\s]*/gi, '');
  t = t.replace(/nostr:nevent1[0-9a-z]+/ig, '');
  return t.trim();
}

/* ---------- Bech32 encode/decode & helpers ---------- */
const CHARSET="qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function bech32Polymod(values){const GEN=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let chk=1;for(const v of values){const b=chk>>25;chk=((chk&0x1ffffff)<<5)^v;for(let i=0;i<5;i++) if((b>>i)&1) chk^=GEN[i];}return chk;}
function hrpExpand(hrp){const ret=[];for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)>>5);ret.push(0);for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)&31);return ret;}
function createChecksum(hrp,data){let values=hrpExpand(hrp).concat(data);values=values.concat([0,0,0,0,0,0]);const mod=bech32Polymod(values)^1;const ret=[];for(let p=0;p<6;p++) ret.push((mod>>(5*(5-p)))&31);return ret;}
function verifyChecksum(hrp,data){return bech32Polymod(hrpExpand(hrp).concat(data))===1;}
function bech32Decode(str){const s=str.trim().toLowerCase();const pos=s.lastIndexOf("1");if(pos<1) return null;const hrp=s.slice(0,pos);const data=[];for(let i=pos+1;i<s.length;i++){const v=CHARSET.indexOf(s[i]);if(v===-1) return null;data.push(v);}if(!verifyChecksum(hrp,data)) return null;return {hrp, words:data.slice(0,-6)};}
function bech32Encode(hrp, words){const chk = createChecksum(hrp, words); const data = words.concat(chk); return hrp + "1" + data.map(v=>CHARSET[v]).join("");}
function convertBits(data,fromBits,toBits,pad=true){let acc=0,bits=0;const ret=[];const maxv=(1<<toBits)-1;for(const value of data){if(value<0||(value>>fromBits)) return null;acc=(acc<<fromBits)|value;bits+=fromBits;while(bits>=toBits){bits-=toBits;ret.push((acc>>bits)&maxv);}}if(pad&&bits) ret.push((acc<<(toBits-bits))&maxv);return ret;}
function hexToBytes(hex){const out=new Uint8Array(hex.length/2);for(let i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16);return out;}
function pubkeyToNpub(hex){
  const data = convertBits(Array.from(hexToBytes(hex)),8,5,true);
  return bech32Encode("npub", data);
}

/* ---------- TLV helpers for nevent/nprofile ---------- */
function neventToId(nevent){
  try{
    const dec=bech32Decode(nevent);
    if(!dec || dec.hrp!=="nevent") return null;
    const bytes = new Uint8Array(convertBits(dec.words,5,8,false));
    for(let i=0;i<bytes.length;){
      const t=bytes[i++]; const l=bytes[i++]; const v=bytes.slice(i, i+l); i+=l;
      if(t===1 && l===32){
        return Array.from(v).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }
  }catch{}
  return null;
}
function nprofileToPubkey(nprofile){
  try{
    const dec=bech32Decode(nprofile);
    if(!dec || dec.hrp!=="nprofile") return null;
    const bytes = new Uint8Array(convertBits(dec.words,5,8,false));
    for(let i=0;i<bytes.length;){
      const t=bytes[i++]; const l=bytes[i++]; const v=bytes.slice(i, i+l); i+=l;
      if(t===0 && l===32){
        return Array.from(v).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }
  }catch{}
  return null;
}

/* ---------- API helpers ---------- */
async function getNoteById(idHex){
  const url = `${API}?id=${idHex}`;
  const r = await fetch(url,{mode:"cors"});
  if(!r.ok) return null;
  const j = await r.json();
  return (j && (j.data?.[0]||j[0]))||null;
}
async function getProfile(pubkeyHex){
  const url=`${API}?pubkey=${pubkeyHex}&kind=0&sort=time&order=descending&limit=1`;
  const r=await fetch(url,{mode:"cors"});
  if(!r.ok) return {name: shortKey(pubkeyHex), picture:"https://api.dicebear.com/7.x/identicon/svg?seed="+pubkeyHex};
  const j=await r.json();
  const ev=(j && (j.data?.[0]||j[0]))||null;
  if(!ev) return {name: shortKey(pubkeyHex), picture:"https://api.dicebear.com/7.x/identicon/svg?seed="+pubkeyHex};
  let meta={};
  try{meta=JSON.parse(ev.content||"{}");}catch{}
  return {
    name: meta.display_name || meta.name || shortKey(pubkeyHex),
    picture: meta.picture || "https://api.dicebear.com/7.x/identicon/svg?seed="+pubkeyHex,
    lud16: meta.lud16 || "",
    lud06: meta.lud06 || ""
  };
}
function shortKey(k){return k.slice(0,8)+"…"+k.slice(-4);}

async function getKind0(pubkeyHex){
  const url=`${API}?pubkey=${pubkeyHex}&kind=0&sort=time&order=descending&limit=1`;
  const r=await fetch(url,{mode:"cors"});
  if(!r.ok) return null;
  const j=await r.json();
  return (j && (j.data?.[0]||j[0]))||null;
}
async function getKind1(pubkeyHex){
  const url=`${API}?pubkey=${pubkeyHex}&kind=1&sort=time&order=descending&limit=${DEFAULT_LIMIT}`;
  const r=await fetch(url,{mode:"cors"});
  if(!r.ok) return [];
  const j=await r.json();
  return j?.data||[];
}

/* ---------- Media helpers ---------- */
function mediaBoxForImage(src){
  const box=document.createElement("div"); box.className="media-box";
  const img=document.createElement("img"); img.src=src; img.alt="image";
  img.onclick=()=>window.open(src,"_blank");
  box.appendChild(img);
  return box;
}
function mediaBoxForVideo(src){
  const box=document.createElement("div"); box.className="media-box";
  const overlay=document.createElement("div"); overlay.className="play-overlay"; overlay.textContent="▶ CLICK TO PLAY";
  overlay.onclick=()=>{
    box.removeChild(overlay);
    const v=document.createElement("video");
    v.src=src; v.controls=true; v.playsInline=true; v.preload="none";
    v.style.maxHeight="100%"; v.style.maxWidth="100%";
    box.appendChild(v);
    v.focus();
  };
  box.appendChild(overlay);
  return box;
}
function mediaBoxForLive(url){
  const box=document.createElement("div"); box.className="media-box";
  const overlay=document.createElement("div"); overlay.className="play-overlay"; overlay.textContent="▶ CLICK TO OPEN STREAM";
  overlay.onclick=()=>{
    box.removeChild(overlay);
    const f=document.createElement("iframe");
    f.allow="accelerometer; encrypted-media; picture-in-picture; fullscreen";
    f.style.width="100%"; f.style.height="100%"; f.frameBorder="0";
    f.src=url;
    box.appendChild(f);
  };
  box.appendChild(overlay);
  return box;
}

/* ---------- Mentions (fixed & robust) ---------- */
async function replaceNprofileMentions(container){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  for (const node of nodes) {
    const text = node.textContent;
    const matches = findAllNprofiles(text);
    if (!matches.length) continue;

    const frag = document.createDocumentFragment();
    let lastIndex = 0;

    for (const token of matches) {
      const index = text.indexOf(token, lastIndex);
      if (index > lastIndex) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex, index)));
      }

      const placeholder = document.createElement("span");
      placeholder.className = "mention";
      placeholder.textContent = "…";
      frag.appendChild(placeholder);

      (async () => {
        const pubkey = nprofileToPubkey(token);
        const profile = pubkey
          ? await getProfile(pubkey)
          : {name: token, picture:"https://api.dicebear.com/7.x/identicon/svg?seed=p"};

        const a = document.createElement("a");
        a.href = "https://njump.me/" + token;
        a.target = "_blank"; a.rel="noopener noreferrer";
        a.className = "mention visible";

        const img = document.createElement("img"); img.src = profile.picture; img.alt = profile.name;
        const label = document.createElement("span"); label.className="label"; label.textContent = profile.name;

        a.appendChild(img); a.appendChild(label);
        placeholder.replaceWith(a);
      })();

      lastIndex = index + token.length;
    }

    if (lastIndex < text.length) {
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    node.parentNode.replaceChild(frag, node);
  }
}

/* ---------- Feed ---------- */
async function drawFeed(events){
  feedEl.innerHTML="";
  if(!events?.length){
    feedEl.innerHTML="<p style='color:var(--muted);text-align:center;'>No posts found.</p>";
    overlay.classList.add("hidden");
    return;
  }
  for(const ev of events){
    if(ev.tags && ev.tags.some(t=>t[0]==="e")) continue;

    const post=document.createElement("article");
    post.className="post";

    const header=document.createElement("div"); header.className="post-header";
    const pfp=document.createElement("img"); pfp.className="pfp"; pfp.src=document.getElementById("pfp").src;
    const metaDiv=document.createElement("div"); metaDiv.className="post-meta";
    const name=document.createElement("div"); name.className="name"; name.textContent=document.getElementById("profName").textContent;
    const time=document.createElement("div"); time.className="time"; time.textContent=humanTime(ev.created_at);
    metaDiv.appendChild(name); metaDiv.appendChild(time);
    header.appendChild(pfp); header.appendChild(metaDiv);

    const content=document.createElement("div"); content.className="content";
    const textOnly = stripMediaAndNevent(ev.content||"");
    content.innerHTML = linkify(textOnly);
    await replaceNprofileMentions(content);

    const gallery=document.createElement("div"); gallery.className="gallery";
    const imgs=extractImages(ev.content||"");
    const vids=extractVideos(ev.content||"");
    const lives=extractLive(ev.content||"");

    imgs.forEach(u=> gallery.appendChild(mediaBoxForImage(u)));
    vids.forEach(u=> gallery.appendChild(mediaBoxForVideo(u)));
    lives.forEach(u=> gallery.appendChild(mediaBoxForLive(u)));

    if(gallery.childNodes.length === 1) gallery.classList.add("single");

    post.appendChild(header);
    post.appendChild(content);
    if(gallery.childNodes.length) post.appendChild(gallery);

    const nevent = findNevent(ev.content||"");
    if(nevent){
      const idHex = neventToId(nevent);
      if(idHex){
        try{
          const quoted = await getNoteById(idHex);
          if(quoted){
            const qProfile = await getProfile(quoted.pubkey);
            const quoteDiv=document.createElement("div"); quoteDiv.className="quote";
            const qh=document.createElement("div"); qh.className="quote-header";
            const qp=document.createElement("img"); qp.src=qProfile.picture;
            const qname=document.createElement("div"); qname.className="quote-name"; qname.textContent=qProfile.name;
            qh.appendChild(qp); qh.appendChild(qname);
            const qt=document.createElement("div"); qt.className="quote-text"; qt.textContent=(quoted.content||"").slice(0,500);
            quoteDiv.appendChild(qh); quoteDiv.appendChild(qt);
            post.appendChild(quoteDiv);
          }
        }catch(e){ console.warn("Failed to render nevent quote", e); }
      }
    }

    attachInteractions(post, ev);
    feedEl.appendChild(post);
  }

  setupFadeIn();
  overlay.classList.add("hidden");
}
function setupFadeIn(){
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.classList.add("visible");
      else entry.target.classList.remove("visible");
    });
  },{threshold:0.2});
  document.querySelectorAll(".post").forEach(el=>observer.observe(el));
}

/* ---------- Nostr interactions: NIP-07 + relay-backed comments/reactions ---------- */
const WRITE_RELAYS = ["wss://nos.lol","wss://relay.damus.io","wss://purplerelay.com","wss://relay.primal.net"];
let signedInPubkey = null;
let nostrPool = null;
let nostrTools = null;
const reactionEmoji = ["❤️","🔥","😂","😻","🚀","💜"];

async function getNostrTools(){
  if(!nostrTools) nostrTools = await import("https://esm.sh/nostr-tools@2.10.4");
  return nostrTools;
}
function npubShort(hex){return hex ? hex.slice(0,8)+"…"+hex.slice(-4) : "";}
async function connectNostr(){
  if(!window.nostr){
    alert("No Nostr browser signer was found. Install or enable a NIP-07 compatible Nostr extension, then try again.");
    return;
  }
  try{
    signedInPubkey = await window.nostr.getPublicKey();
    const profile = await getProfile(signedInPubkey);
    document.getElementById("loginBtn").textContent = "✓ " + (profile.name || npubShort(signedInPubkey));
    document.getElementById("blogStatus").textContent = "Signed in · " + npubShort(signedInPubkey);
    document.getElementById("blogStatus").style.color = "#a8f0c8";
    document.querySelectorAll(".comment-input").forEach(el=>el.placeholder="Write a reply…");
  }catch(error){
    console.error("Nostr login failed",error);
    alert("Could not connect to your Nostr signer. Please unlock it and approve the connection.");
  }
}
async function publishNostrEvent(event){
  if(!window.nostr || !signedInPubkey) throw new Error("Please log in with your Nostr signer first.");
  const signed = await window.nostr.signEvent(event);
  const {SimplePool} = await getNostrTools();
  if(!nostrPool) nostrPool = new SimplePool();
  const results = await Promise.allSettled(nostrPool.publish(WRITE_RELAYS,signed));
  if(!results.some(r=>r.status==="fulfilled")) throw new Error("Your signer signed the event, but no relay confirmed publishing. Try again.");
  return signed;
}
async function publishReaction(note, emoji){
  if(!signedInPubkey){await connectNostr();if(!signedInPubkey)return;}
  const event = {kind:7,created_at:Math.floor(Date.now()/1000),tags:[["e",note.id],["p",note.pubkey]],content:emoji};
  await publishNostrEvent(event);
}
async function publishComment(note, text){
  if(!signedInPubkey){await connectNostr();if(!signedInPubkey)return;}
  const event = {kind:1,created_at:Math.floor(Date.now()/1000),tags:[["e",note.id,"","reply"],["p",note.pubkey]],content:text};
  await publishNostrEvent(event);
}
async function loadNoteInteractions(note, container){
  const list = container.querySelector(".comment-list");
  const stats = container.querySelector(".interaction-stats");
  try{
    const {SimplePool} = await getNostrTools();
    if(!nostrPool) nostrPool = new SimplePool();
    const events = await Promise.race([
      nostrPool.querySync(WRITE_RELAYS,{kinds:[1,7],"#e":[note.id],limit:100}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),9000))
    ]);
    const replies = events.filter(e=>e.kind===1 && (e.tags||[]).some(t=>t[0]==="e"&&t[1]===note.id));
    const reactions = events.filter(e=>e.kind===7);
    stats.textContent = replies.length + " replies · " + reactions.length + " reactions";
    list.replaceChildren();
    for(const reply of replies.sort((a,b)=>a.created_at-b.created_at).slice(-12)){
      const item=document.createElement("div");item.className="comment-item";
      const author=document.createElement("div");author.className="comment-author";author.textContent=npubShort(reply.pubkey);
      const body=document.createElement("div");body.className="comment-body";body.textContent=reply.content;
      item.append(author,body);list.appendChild(item);
    }
  }catch(error){stats.textContent="Replies and reactions load when relays respond.";}
}
function attachInteractions(post, note){
  const actions=document.createElement("div");actions.className="post-actions";
  const like=document.createElement("button");like.className="post-action";like.type="button";like.textContent="❤️ Like";
  like.onclick=async()=>{like.disabled=true;try{await publishReaction(note,"❤️");like.classList.add("active");like.textContent="❤️ Liked";}catch(e){alert(e.message||"Could not publish reaction.");}finally{like.disabled=false;}};
  actions.appendChild(like);
  reactionEmoji.filter(e=>e!=="❤️").forEach(emoji=>{
    const btn=document.createElement("button");btn.className="post-action";btn.type="button";btn.textContent=emoji;btn.title="React "+emoji;
    btn.onclick=async()=>{btn.disabled=true;try{await publishReaction(note,emoji);btn.classList.add("active");}catch(e){alert(e.message||"Could not publish reaction.");}finally{btn.disabled=false;}};
    actions.appendChild(btn);
  });
  const commentJump=document.createElement("button");commentJump.className="post-action";commentJump.type="button";commentJump.textContent="💬 Comment";
  actions.appendChild(commentJump);
  post.appendChild(actions);

  const interactions=document.createElement("section");interactions.className="post-interactions";
  const stats=document.createElement("div");stats.className="interaction-note interaction-stats";stats.textContent="Loading replies and reactions…";
  const list=document.createElement("div");list.className="comment-list";
  const form=document.createElement("form");form.className="comment-form";
  const input=document.createElement("input");input.className="comment-input";input.type="text";input.maxLength=2000;input.placeholder="Sign in to write a reply…";input.setAttribute("aria-label","Write a comment");
  const submit=document.createElement("button");submit.className="btn primary";submit.type="submit";submit.textContent="Reply";
  form.append(input,submit);
  const noteLine=document.createElement("div");noteLine.className="interaction-note";noteLine.textContent="Reactions and replies are public Nostr events. A NIP-07 signer is required to publish.";
  form.onsubmit=async e=>{
    e.preventDefault();const text=input.value.trim();if(!text)return;
    submit.disabled=true;
    try{await publishComment(note,text);input.value="";noteLine.textContent="Reply published to Nostr relays.";await loadNoteInteractions(note,interactions);}
    catch(error){noteLine.textContent=error.message||"Could not publish reply.";}
    finally{submit.disabled=false;}
  };
  commentJump.onclick=()=>{input.focus();interactions.scrollIntoView({behavior:"smooth",block:"nearest"});};
  interactions.append(stats,list,form,noteLine);post.appendChild(interactions);
  loadNoteInteractions(note,interactions);
}

/* ---------- Boot ---------- */
async function load(){
  try{
    const [profileEv, notes] = await Promise.all([getKind0(PUBKEY_HEX), getKind1(PUBKEY_HEX)]);
    const meta = profileEv ? await getProfile(PUBKEY_HEX) : await getProfile(PUBKEY_HEX);
    applyProfileToBanner(meta);
    await drawFeed(notes);

    // Button wiring
    document.getElementById("loginBtn").onclick = connectNostr;
    document.getElementById("homeBtn").onclick = async ()=>{
      overlay.classList.remove("hidden");
      const latest = await getKind1(PUBKEY_HEX);
      await drawFeed(latest);
    };
    document.getElementById("aboutBtn").onclick = showAbout;
    document.getElementById("liveBtn").onclick = showLivePage;
    document.getElementById("zapBtn").onclick = showZapPage;
  }catch(e){
    console.error(e);
    feedEl.innerHTML="<p style='color:#f77;text-align:center;'>Error loading posts.</p>";
  }finally{
    overlay.classList.add("hidden");
  }
}

window.addEventListener("load", load);
