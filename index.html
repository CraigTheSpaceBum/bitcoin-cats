<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bitcoin Cats</title>
  <meta name="description" content="Personal blog powered by Nostr (read-only feed).">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-overlay: rgba(0,0,0,0.6);
      --text:#f3f3f6;
      --muted:#b0b0ba;
      --border:#2c2c3c;
      --orange:#ffa447;
      --orange-2:#ff7a1a;
      --card-bg: rgba(20,20,28,0.65);
      --quote-bg: rgba(40,40,52,0.5);
      --shadow: 0 6px 20px rgba(0,0,0,0.45);
      --play-bg: rgba(0,0,0,0.5);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;scroll-behavior:smooth;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    body{
      color:var(--text);
      background-blend-mode: darken;
      overflow-x:hidden;
    }
    a{color:#ffd099;text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:1680px;margin:0 auto;padding:20px}

    /* NEW: Banner */
    header.profile{
      position:relative;
      margin:30px 0 30px 0;
      animation:fadeIn 1.5s ease;
    }
    .banner{
      position:relative;
      width:100%;
      border:1px solid rgba(255,180,120,0.25);
      background:
        linear-gradient(90deg, rgba(255,164,71,0.35), rgba(255,122,26,0.20) 45%, rgba(255,164,71,0.18));
      backdrop-filter: blur(4px);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:22px 22px 22px 120px; /* space for overlapping pfp */
      min-height:120px;
      overflow:visible;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .pfp-wrap{
      position:absolute;
      left:-28px; top:50%;
      transform:translateY(-50%);
      width:140px; height:140px;
    }
    .pfp-wrap img{
      width:140px; height:140px; border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,164,71,0.6);
      box-shadow:0 10px 30px rgba(0,0,0,0.55);
    }
    .id-block{
      display:flex; flex-direction:column; gap:8px;
    }
    .id-name{
      font-size:1.9rem; font-weight:900; color:#ffe0c2; text-shadow:0 2px 10px rgba(0,0,0,0.35);
    }
    .id-npub{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:0.95rem; color:#ffe0c2; opacity:0.85;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(255,200,150,0.25);
      padding:4px 10px; border-radius:999px;
      max-width:100%;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .actions{
      margin-left:auto;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .btn{
      border:1px solid rgba(255,200,150,0.25);
      background:linear-gradient(180deg, rgba(25,18,12,0.8), rgba(20,14,10,0.8));
      color:#ffd9b3;
      padding:9px 14px; border-radius:999px; font-weight:800; cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s ease, filter .15s ease;
      user-select:none;
    }
    .btn:hover{filter:brightness(1.12)}
    .btn[aria-current="page"]{border-color:rgba(255,164,71,.62);color:#ffd19e;background:rgba(255,164,71,.14);box-shadow:0 0 0 1px rgba(255,164,71,.10),0 0 18px rgba(255,164,71,.12)}
    .actions{padding:8px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(8,8,14,.42)}
    .nostr-login-modal[hidden]{display:none!important}
    .nostr-login-modal{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;padding:clamp(10px,2vw,24px);background:rgba(3,4,12,.82);backdrop-filter:blur(13px)}
    .nostr-login-modal-panel{width:min(900px,100%);height:min(900px,calc(100dvh - 28px));overflow:hidden;border:1px solid rgba(139,92,246,.42);border-radius:22px;background:#090910;box-shadow:0 28px 100px rgba(0,0,0,.7),0 0 48px rgba(139,92,246,.14)}
    .nostr-login-frame{display:block;width:100%;height:100%;border:0;background:#090910}
    @media(max-width:700px){.nostr-login-modal{padding:6px}.nostr-login-modal-panel{height:calc(100dvh - 12px);border-radius:16px}}
    .btn:active{transform:scale(0.98)}
    .btn.ghost{background:transparent}
    .followers-badge{
      display:inline-flex; align-items:center; gap:6px;
    }

    /* Loading overlay */
    .loading-overlay{
      position:fixed; inset:0; display:grid; place-items:center; z-index:99;
      background: radial-gradient(800px 400px at 20% -10%, rgba(255,122,26,0.12), transparent 60%) no-repeat,
                  radial-gradient(900px 500px at 110% 120%, rgba(255,164,71,0.10), transparent 60%) no-repeat,
                  rgba(5,5,8,0.9);
      transition: opacity .6s ease, visibility .6s ease;
    }
    .loading-overlay.hidden{opacity:0; visibility:hidden;}
    .loading-text{
      font-family: "Press Start 2P", monospace;
      color:#ffb77a; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,122,26,0.5);
      animation: flicker 1.3s infinite;
    }
    @keyframes flicker{0%,100%{opacity:1}50%{opacity:0.55}}

    main.feed{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap:24px;
      padding-bottom:100px;
    }
    article.post{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      min-height:480px;
      opacity:0;
      transform:translateY(20px);
      transition:opacity 0.8s ease, transform 0.8s ease;
    }
    article.post.visible{opacity:1;transform:translateY(0)}
    .post-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .pfp{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .post-meta{display:flex;flex-direction:column}
    .name{font-weight:800;color:var(--orange)}
    .time{font-size:13px;color:var(--muted)}
    .content{
      white-space:pre-wrap;
      font-size:15px;line-height:1.55;margin-top:4px;
      /* NEW: keep super-long tokens from breaking the card */
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .gallery{margin-top:6px;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;flex:1;min-height:160px}
    .gallery.single{min-height:0; height:100%;}
    .gallery::-webkit-scrollbar{height:8px}
    .gallery::-webkit-scrollbar-thumb{background:#333;border-radius:999px}
    .media-box{
      background:#0b0b12; border:1px solid var(--border); border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      min-width:260px; max-width:100%; height:220px; flex-shrink:0; position:relative; overflow:hidden;
    }
    .gallery.single .media-box{height:100%; min-width:0; width:100%}
    .media-box img{max-height:100%; max-width:100%; object-fit:contain; display:block}
    .play-overlay{
      position:absolute; inset:0; display:grid; place-items:center; background:var(--play-bg);
      opacity:1; transition:opacity .2s ease; cursor:pointer;
      font-weight:800; color:#ffd9b3; border:1px dashed rgba(255,255,255,0.15);
    }
    .play-overlay:hover{opacity:1}
    .quote{
      background:var(--quote-bg);
      border-left:3px solid var(--orange);
      border-radius:12px;
      padding:10px 14px;
      margin-top:10px;
    }
    .quote-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .quote-header img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .quote-name{font-size:13px;font-weight:700;color:var(--orange)}
    .quote-text{font-size:14px;color:var(--muted);white-space:pre-wrap;line-height:1.4;}
    .mention{
      display:inline-flex; align-items:center; gap:6px; padding:2px 6px; border-radius:999px;
      background: rgba(255,164,71,0.08); border:1px solid rgba(255,164,71,0.25);
      margin:0 2px; opacity:0; transform:translateY(4px);
      transition:opacity .4s ease, transform .4s ease;
      /* NEW: never let badges overflow */
      max-width:220px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      vertical-align:middle;
    }
    .mention.visible{opacity:1; transform:translateY(0);}
    .mention img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .mention .label{
      color:var(--orange); font-weight:700; font-size:13px;
      /* NEW: clamp the text inside the badge */
      max-width:170px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      display:inline-block;
    }
    footer{color:var(--muted);font-size:12px;text-align:center;padding:40px 0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  
    .about-page {
      animation: fadeIn 0.8s ease forwards;
      border-radius: 0;
      padding: 10px;
      box-shadow: none;
      border: none;
      color: var(--text);
      min-height: 10vh;
    }

    .about-page.hidden {
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modern blog refresh */
    body{background:radial-gradient(ellipse at 10% 0%,rgba(255,164,71,.10),transparent 35%),linear-gradient(rgba(5,5,9,.90),rgba(5,5,9,.94)),url('BackgroundLoop.webp') center/cover fixed}
    .container{max-width:1440px;padding:clamp(14px,2.5vw,32px)}
    .banner{background:linear-gradient(135deg,rgba(25,25,39,.96),rgba(18,18,28,.94));border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:24px 24px 24px 130px;backdrop-filter:blur(18px)}
    .id-name{font-family:system-ui,sans-serif;font-size:clamp(1.5rem,3vw,2.15rem);letter-spacing:-.04em;color:#f8f5ff}
    .id-npub{color:#c5c1d5;background:rgba(0,0,0,.24);border-color:rgba(255,255,255,.1);font-size:.78rem}
    .btn{font-family:inherit;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#f3f0fa;border-radius:12px;padding:10px 14px;box-shadow:none;font-weight:700;transition:transform .15s,border-color .15s,background .15s}
    .btn:hover{background:rgba(255,164,71,.10);border-color:rgba(255,164,71,.45);transform:translateY(-1px)}
    .btn.primary{background:linear-gradient(135deg,#ffb45f,#ff842e);color:#241507;border-color:transparent}
    main.feed{grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:18px;padding:8px 0 80px}
    article.post{min-height:0;padding:20px;background:linear-gradient(155deg,rgba(22,22,34,.96),rgba(13,13,22,.97));border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.24);opacity:1;transform:none;transition:border-color .2s,transform .2s}
    article.post:hover{border-color:rgba(255,164,71,.28);transform:translateY(-2px)}
    .post-header{padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px}
    .pfp{width:44px;height:44px}
    .name{color:#ffb76c;font-size:14px}
    .time{font-size:12px;margin-top:3px}
    .content{font-size:15px;line-height:1.8;color:#e9e6f2;margin:4px 0 12px}
    .gallery{flex:none;min-height:0;margin:10px 0}
    .media-box{border-radius:14px;border-color:rgba(255,255,255,.1)}
    .post-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
    .post-action{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#d9d5e5;font:600 12px system-ui,sans-serif;cursor:pointer}
    .post-action:hover,.post-action.active{color:#ffd19e;border-color:rgba(255,164,71,.45);background:rgba(255,164,71,.09)}
    .post-action:disabled{opacity:.5;cursor:not-allowed}
    .post-interactions{margin-top:12px}
    .comment-list{display:grid;gap:9px;margin:10px 0}
    .comment-item{min-width:0;padding:12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
    .comment-author-row{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:7px}
    .comment-pfp{width:30px;height:30px;flex:none;border-radius:50%;object-fit:cover;border:1px solid rgba(255,164,71,.3);background:#171722}
    .comment-author{min-width:0;font-size:12px;font-weight:750;color:#ffb76c;overflow-wrap:anywhere}
    .comment-body{min-width:0;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
    .comment-body .mention{max-width:100%}
    article.post{min-width:0;overflow:hidden;box-sizing:border-box}
    .content{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
    .gallery{min-width:0;max-width:100%;box-sizing:border-box}
    .media-box{min-width:0;max-width:100%;box-sizing:border-box;flex:0 0 auto}
    .gallery:not(.single) .media-box{min-width:min(260px,85%);max-width:100%}
    .media-box img{width:auto;height:auto;max-width:100%;max-height:min(65vh,560px);object-fit:contain}
    .gallery.single .media-box{min-width:0;width:100%;max-width:100%;height:auto;min-height:0;max-height:none}
    .gallery.single .media-box img{display:block;width:100%;height:auto;max-height:min(70vh,640px);object-fit:contain}
    .gallery.single .media-box video,.gallery.single .media-box iframe{width:100%;max-width:100%;height:auto;max-height:min(70vh,640px);aspect-ratio:16/9}
    @media(max-width:700px){.gallery{overflow-x:auto}.gallery.single .media-box{width:100%;min-width:0}.gallery.single .media-box img{max-height:60vh}.featured-post .media-box,.featured-post .gallery.single .media-box{height:auto;min-height:0}}
    .comment-form{display:flex;gap:8px;margin-top:10px}
    .comment-input{min-width:0;flex:1;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:11px 12px;color:var(--text);font:13px system-ui,sans-serif;outline:none}
    .comment-input:focus{border-color:rgba(255,164,71,.6)}
    .interaction-note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}
    .blog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px}
    .blog-heading{font-size:clamp(22px,3vw,30px);font-weight:850;letter-spacing:-.04em}
    .blog-subtitle{font-size:13px;color:var(--muted);margin-top:6px}
    /* Editorial blog layout: feature the newest post, then a clean reading grid */
    .blog-toolbar{padding:20px 22px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:linear-gradient(120deg,rgba(255,164,71,.08),rgba(20,20,32,.88));}
    .blog-heading{font-size:clamp(26px,4vw,38px)}
    .blog-subtitle{max-width:680px;line-height:1.6}
    .tag{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);color:#d8d3e5;font-size:11px}
    main.feed{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:20px}
    .blog-page-banner {
      grid-column:1 / -1;
      width:100%;
      margin:4px 0 2px;
      overflow:hidden;
      border:1px solid rgba(255,164,71,.24);
      border-radius:18px;
      background:rgba(12,12,20,.72);
      box-shadow:0 14px 40px rgba(0,0,0,.24);
    }
    .blog-page-banner img {
      display:block;
      width:100%;
      height:auto;
      max-width:100%;
      object-fit:contain;
    }
    article.post.featured-post{grid-column:1/-1;padding:clamp(22px,4vw,42px);background:radial-gradient(ellipse at 100% 0%,rgba(255,164,71,.12),transparent 45%),linear-gradient(145deg,rgba(28,27,42,.98),rgba(13,13,22,.98));border-color:rgba(255,164,71,.3);position:relative;overflow:hidden}
    .featured-label{display:inline-flex;align-items:center;gap:7px;margin-bottom:18px;padding:7px 10px;border:1px solid rgba(255,164,71,.28);border-radius:999px;color:#ffc58b;background:rgba(255,164,71,.08);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .featured-post .content{font-size:clamp(16px,1.6vw,19px);line-height:1.9;max-width:1000px}
    .featured-post .post-header{border-bottom:0;margin-bottom:8px}
    .featured-post .pfp{width:52px;height:52px}
    .featured-post .gallery{margin:18px 0 8px}
    .featured-post .media-box{height:clamp(230px,38vw,480px);min-width:min(100%,300px)}
    .featured-post .gallery.single .media-box{height:clamp(230px,38vw,480px)}
    .post-ribbon{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:0 0 12px}
    article.post:not(.featured-post){min-height:100%;padding:22px}
    .post-header .name{font-size:14px}
    .donation-page{grid-column:1/-1;width:100%;min-width:0;animation:fadeIn .55s ease forwards}
    .donation-dialog{width:min(1100px,100%);margin:0 auto;overflow:hidden;border:1px solid rgba(192,132,252,.32);border-radius:22px;background:linear-gradient(145deg,#191927,#0c0c14);box-shadow:0 0 18px rgba(168,85,247,.38),0 0 42px rgba(124,58,237,.24),0 30px 100px rgba(0,0,0,.65);animation:donation-window-pulse 2.8s ease-in-out infinite}
    @keyframes donation-window-pulse{0%,100%{border-color:rgba(192,132,252,.28);box-shadow:0 0 14px rgba(168,85,247,.32),0 0 34px rgba(124,58,237,.20),0 30px 100px rgba(0,0,0,.65)}50%{border-color:rgba(216,180,254,.68);box-shadow:0 0 25px rgba(192,132,252,.70),0 0 60px rgba(139,92,246,.42),0 30px 100px rgba(0,0,0,.65)}}
    @media(prefers-reduced-motion:reduce){.donation-dialog{animation:none;box-shadow:0 0 22px rgba(168,85,247,.48),0 30px 100px rgba(0,0,0,.65)}}
    .donation-head{position:relative;display:block;padding:0;border-bottom:1px solid rgba(255,255,255,.08)}
    .donation-banner-wrap{min-width:0;width:100%}
    .donation-title-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .donation-banner{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center;border-radius:21px 21px 0 0}
    .donation-head h2{font-size:22px;letter-spacing:-.03em}.donation-head p{color:var(--muted);font-size:13px;line-height:1.6;margin-top:6px}
    .donation-methods{display:grid;grid-template-columns:minmax(185px,230px) minmax(0,1fr);align-items:start;gap:16px;padding:20px}
    .donation-options{min-width:0;display:grid;gap:9px;align-content:start}
    .donation-option{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.045);color:#eeeaf5;text-align:left;text-decoration:none;font:700 13px/1.4 system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
    .donation-option:hover{background:rgba(255,164,71,.1);border-color:rgba(255,164,71,.42);text-decoration:none;transform:translateY(-1px)}
    .donation-option:focus-visible{outline:2px solid #ffb76c;outline-offset:2px}
    .donation-option[aria-pressed="true"]{color:#ffd1a0;background:rgba(255,164,71,.14);border-color:rgba(255,164,71,.55)}
    .donation-option-link{background:linear-gradient(135deg,#123b78,#075ca7);border-color:rgba(100,170,255,.35);color:#fff}
    .donation-panels{min-width:0}
    .donation-method[hidden]{display:none!important}
    .donation-method{min-width:0;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(255,255,255,.025)}
    .donation-method h3{font-size:15px;margin-bottom:6px}.donation-method p{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:14px}
    .donation-qr{display:block;width:210px;height:210px;max-width:100%;margin:10px auto 14px;border-radius:12px;background:#fff;padding:8px;object-fit:contain}
    .donation-address{padding:11px 12px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(0,0,0,.24);font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;color:#f4e7d9}
    .donation-recipient{margin-top:12px;color:var(--muted);font-size:10px;line-height:1.5;overflow-wrap:anywhere}
    .donation-recipient code{color:#ded7ed;font-family:ui-monospace,monospace}

<script>

/* ---------- Utils ---------- */
function humanTime(ts){return new Date(ts*1000).toLocaleString();}
function linkify(text){

function extractLive(text){

  });
  return list;
}
function findNevent(text){
  const m = text.match(/nostr:nevent1[0-9a-z]+/i);
  return m ? m[0] : null;
}
function findAllNprofiles(text){
  // Accept canonical Nostr URIs, escaped URI colons, and bare nprofile identifiers.
  return text.match(/(?:nostr\\?:)?nprofile1[0-9a-z]+/ig) || [];
}
function stripMediaAndNevent(text){
  let t = text.replace(/https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp|mp4|webm|mov)/gi, '');
  t = t.replace(/https?:\/\/(?:zap\.stream|nostr\.build\/live)[^\s]*/gi, '');

}

/* ---------- Bech32 encode/decode & helpers ---------- */
const CHARSET="qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function bech32Polymod(values){const GEN=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let chk=1;for(const v of values){const b=chk>>25;chk=((chk&0x1ffffff)<<5)^v;for(let i=0;i<5;i++) if((b>>i)&1) chk^=GEN[i];}return chk;}
function hrpExpand(hrp){const ret=[];for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)>>5);ret.push(0);for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)&31);return ret;}
function createChecksum(hrp,data){let values=hrpExpand(hrp).concat(data);values=values.concat([0,0,0,0,0,0]);const mod=bech32Polymod(values)^1;const ret=[];for(let p=0;p<6;p++) ret.push((mod>>(5*(5-p)))&31);return ret;}
function verifyChecksum(hrp,data){return bech32Polymod(hrpExpand(hrp).concat(data))===1;}
function bech32Decode(str){const s=str.trim().toLowerCase();const pos=s.lastIndexOf("1");if(pos<1) return null;const hrp=s.slice(0,pos);const data=[];for(let i=pos+1;i<s.length;i++){const v=CHARSET.indexOf(s[i]);if(v===-1) return null;data.push(v);}if(!verifyChecksum(hrp,data)) return null;return {hrp, words:data.slice(0,-6)};}
function bech32Encode(hrp, words){const chk = createChecksum(hrp, words); const data = words.concat(chk); return hrp + "1" + data.map(v=>CHARSET[v]).join("");}
function convertBits(data,fromBits,toBits,pad=true){let acc=0,bits=0;const ret=[];const maxv=(1<<toBits)-1;for(const value of data){if(value<0||(value>>fromBits)) return null;acc=(acc<<fromBits)|value;bits+=fromBits;while(bits>=toBits){bits-=toBits;ret.push((acc>>bits)&maxv);}}if(pad&&bits) ret.push((acc<<(toBits-bits))&maxv);return ret;}
function hexToBytes(hex){const out=new Uint8Array(hex.length/2);for(let i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16);return out;}
function pubkeyToNpub(hex){
  const data = convertBits(Array.from(hexToBytes(hex)),8,5,true);
  return bech32Encode("npub", data);
}
// Encode a v1 SegWit witness program with Bech32m, using the same direct x-only
// Nostr public-key-to-Taproot receive-address model shown by Sifaka.Live.
function bech32mEncode(hrp, words){
  const values=hrpExpand(hrp).concat(words,[0,0,0,0,0,0]);
  const mod=(bech32Polymod(values)^0x2bc830a3)>>>0;
  const checksum=[];
  for(let p=0;p<6;p++) checksum.push((mod>>>(5*(5-p)))&31);
  return hrp+"1"+words.concat(checksum).map(v=>CHARSET[v]).join("");
}
function deriveNostrTaprootAddress(pubkeyHex){
  const key=String(pubkeyHex||"").toLowerCase();
  if(!/^[0-9a-f]{64}$/.test(key)) throw new Error("Invalid Nostr public key for Bitcoin address.");
  const bytes=hexToBytes(key);
  if(bytes.length!==32) throw new Error("Expected a 32-byte Nostr public key.");
  const programWords=convertBits(Array.from(bytes),8,5,true);
  if(!programWords || programWords.length!==52) throw new Error("Could not encode the Nostr public key as a Taproot address.");
  return bech32mEncode("bc",[1,...programWords]);
}

/* ---------- TLV helpers for nevent/nprofile ---------- */
function neventToId(nevent){
  try{
    const dec=bech32Decode(nevent);
    if(!dec || dec.hrp!=="nevent") return null;
    const bytes = new Uint8Array(convertBits(dec.words,5,8,false));
    for(let i=0;i<bytes.length;){
      const t=bytes[i++]; const l=bytes[i++]; const v=bytes.slice(i, i+l); i+=l;
      if(t===1 && l===32){
        return Array.from(v).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }
  }catch{}
  return null;
}
function nprofileToPubkey(nprofile){
  try{
    const normalized=String(nprofile||"").replace(/^nostr\\?:/i,"");
    const dec=bech32Decode(normalized);
    if(!dec || dec.hrp!=="nprofile") return null;
    const bytes = new Uint8Array(convertBits(dec.words,5,8,false));
    for(let i=0;i<bytes.length;){
      const t=bytes[i++]; const l=bytes[i++]; const v=bytes.slice(i, i+l); i+=l;
      if(t===0 && l===32){
        return Array.from(v).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }
  }catch{}
  return null;
}

/* ---------- API helpers ---------- */
async function getNoteById(idHex){
  const url = `${API}?id=${idHex}`;
  const r = await fetch(url,{mode:"cors"});
  if(!r.ok) return null;
  const j = await r.json();
  return (j && (j.data?.[0]||j[0]))||null;
}
const profileCache = new Map();
function fallbackProfile(pubkeyHex){
  return {
    name: shortKey(pubkeyHex) || "Nostr user",
    picture: "https://api.dicebear.com/7.x/identicon/svg?seed=" + encodeURIComponent(pubkeyHex || "nostr-user"),
    lud16: "",
    lud06: ""
  };
}
function profileMetadataFromEvent(ev){
  if(!ev) return {};
  if(ev.content && typeof ev.content === "object") return ev.content;
  if(typeof ev.content === "string"){
    try { return JSON.parse(ev.content || "{}") || {}; } catch {}
  }
  if(ev.metadata && typeof ev.metadata === "object") return ev.metadata;
  if(ev.profile && typeof ev.profile === "object") return ev.profile;
  if(ev.name || ev.display_name || ev.picture || ev.lud16 || ev.lud06) return ev;
  return {};
}
async function getProfile(pubkeyHex){
  const key=String(pubkeyHex||"").toLowerCase();
  const fallback=fallbackProfile(key);
  if(!/^[0-9a-f]{64}$/.test(key)) return fallback;
  if(profileCache.has(key)) return profileCache.get(key);

  const pending=(async()=>{
    let apiMeta={};
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),4500);
      try{
        const url=`${API}?pubkey=${key}&kind=0&sort=time&order=descending&limit=10`;
        const r=await fetch(url,{mode:"cors",signal:controller.signal});
        if(r.ok){
          const j=await r.json();
          const rows=Array.isArray(j?.data)?j.data:(Array.isArray(j)?j:[]);
          const ordered=rows.filter(ev=>!ev?.pubkey||String(ev.pubkey).toLowerCase()===key)
            .sort((a,b)=>(b.created_at||0)-(a.created_at||0));
          for(const ev of ordered){
            const meta=profileMetadataFromEvent(ev);
            if(meta&&(meta.name||meta.display_name||meta.picture||meta.lud16||meta.lud06)){
              apiMeta=meta;
              if(meta.name||meta.display_name) break;
            }
          }
        }
      }finally{clearTimeout(timeout);}
    }catch(error){
      console.warn("Profile index lookup failed; trying Nostr relays",error);
    }

    let relayMeta={};
    if(!(apiMeta.name||apiMeta.display_name)||!apiMeta.picture){
      try{
        const {SimplePool}=await getNostrTools();
        if(!nostrPool) nostrPool=new SimplePool();
        const relayEvents=await Promise.race([
          nostrPool.querySync(WRITE_RELAYS,{kinds:[0],authors:[key],limit:20}),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error("profile relay lookup timeout")),6500))
        ]);
        const ordered=(relayEvents||[]).slice().sort((a,b)=>(b.created_at||0)-(a.created_at||0));
        for(const ev of ordered){
          const meta=profileMetadataFromEvent(ev);
          if(meta&&(meta.name||meta.display_name||meta.picture||meta.lud16||meta.lud06)){
            relayMeta=meta;
            if((meta.name||meta.display_name)&&meta.picture) break;
          }
        }
      }catch(error){
        console.warn("Relay profile lookup failed",error);
      }
    }
    return {
      name:apiMeta.display_name||apiMeta.name||relayMeta.display_name||relayMeta.name||fallback.name,
      picture:apiMeta.picture||relayMeta.picture||fallback.picture,
      lud16:apiMeta.lud16||relayMeta.lud16||"",
      lud06:apiMeta.lud06||relayMeta.lud06||""
    };
  })();
  profileCache.set(key,pending);
  try{return await pending;}catch(error){profileCache.delete(key);return fallback;}
}
function shortKey(k){return k?k.slice(0,8)+"…"+k.slice(-4):"";}

async function getKind0(pubkeyHex){
  const url=`${API}?pubkey=${pubkeyHex}&kind=0&sort=time&order=descending&limit=1`;
  const r=await fetch(url,{mode:"cors"});
  if(!r.ok) return null;
  const j=await r.json();
  return (j && (j.data?.[0]||j[0]))||null;
}
function withTimeout(promise,milliseconds,message){
  let timer;
  return Promise.race([
    promise,
    new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),milliseconds);})
  ]).finally(()=>clearTimeout(timer));
}

async function getRelayKind1(pubkeyHex){
  const {SimplePool}=await getNostrTools();
  if(!nostrPool) nostrPool=new SimplePool();
  const results=await Promise.allSettled(FEED_RELAYS.map(relay=>withTimeout(
    nostrPool.querySync([relay],{kinds:[1],authors:[pubkeyHex],limit:FEED_RELAY_LIMIT},{maxWait:4000}),
    5000,
    "Nostr relay post lookup timed out."
  )));
  const events=new Map();
  let responders=0;
  for(const result of results){
    if(result.status!=="fulfilled") continue;
    responders++;
    for(const event of result.value||[]){
      if(event?.id&&event.kind===1&&String(event.pubkey||"").toLowerCase()===String(pubkeyHex).toLowerCase()) events.set(event.id,event);
    }
  }
  if(!responders) throw new Error("No Nostr relay returned a result.");
  return [...events.values()];
}

async function getKind1(pubkeyHex,page=1){
  const url=API+"?pubkey="+encodeURIComponent(pubkeyHex)+"&kind=1&sort=time&order=descending&limit="+DEFAULT_LIMIT+"&page="+page;
  const apiRequest=withTimeout((async()=>{
    const r=await fetch(url,{mode:"cors"});
    if(!r.ok) throw new Error("Could not load blog posts ("+r.status+").");
    return await r.json();
  })(),9000,"Post index lookup timed out.");
  const relayRequest=page===1?getRelayKind1(pubkeyHex):Promise.resolve([]);
  const [apiResult,relayResult]=await Promise.allSettled([apiRequest,relayRequest]);
  if(apiResult.status==="rejected"&&(page!==1||relayResult.status==="rejected")) throw apiResult.reason;
  if(apiResult.status==="rejected") console.warn("Post index unavailable; using recent Nostr relay events.",apiResult.reason);
  if(page===1&&relayResult.status==="rejected") console.warn("Could not refresh posts directly from Nostr relays.",relayResult.reason);

  const payload=apiResult.status==="fulfilled"?apiResult.value:{};
  const apiRows=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);
  const apiEvents=apiRows.filter(event=>event?.kind===1&&String(event.pubkey||"").toLowerCase()===String(pubkeyHex).toLowerCase());
  const relayEvents=page===1&&relayResult.status==="fulfilled"?relayResult.value:[];
  const merged=new Map();
  for(const event of [...apiEvents,...relayEvents]){
    if(event?.id) merged.set(event.id,event);
  }
  const events=(merged.size?[...merged.values()]:[...apiEvents,...relayEvents])
    .sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  const lastPage=payload?.pagination?.last_page;
  const apiHasMore=apiResult.status==="fulfilled"
    ?(typeof lastPage==="boolean"?!lastPage:apiEvents.length>=DEFAULT_LIMIT)
    :false;
  const relaysMayHaveMore=relayEvents.length>=FEED_RELAY_LIMIT;
  return {events,hasMore:apiHasMore||relaysMayHaveMore};
}

/* ---------- Media helpers ---------- */
function mediaBoxForImage(src){

/* ---------- Mentions: normalize escaped/markdown Nostr profile links ---------- */
function normalizeNprofileMarkup(input){
  let text=String(input||"").replace(/nostr\\:/gi,"nostr:");
  text=text.replace(/\*{0,2}\[(?:\*{0,2})?(nostr:nprofile1[0-9a-z]+)(?:\*{0,2})?\]\(\s*https?:\/\/njump\.me\/(?:nostr:)?nprofile1[0-9a-z]+[^)]*\)\*{0,2}/gi,"$1");
  text=text.replace(/\*{1,2}(nostr:nprofile1[0-9a-z]+)\*{1,2}/gi,"$1");
  text=text.replace(/(nostr:nprofile1[0-9a-z]+)(?:\s*\1)+/gi,"$1");
  return text;
}
function linkifyRemainingTextNodes(container){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  const urlRe=/https?:\/\/[^\s]+/g;
  for(const node of nodes){
    if(!node.parentNode||node.parentElement?.closest("a")) continue;
    const text=node.textContent;
    const matches=[...text.matchAll(urlRe)];
    if(!matches.length) continue;
    const frag=document.createDocumentFragment();
    let last=0;
    for(const match of matches){
      let url=match[0];
      let end=match.index+url.length;
      while(/[.,!?;:]$/.test(url)){url=url.slice(0,-1);end--;}
      if(match.index>last) frag.appendChild(document.createTextNode(text.slice(last,match.index)));
      if(url){
        const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=url;
        frag.appendChild(a);
      }
      if(end<match.index+match[0].length) frag.appendChild(document.createTextNode(text.slice(end,match.index+match[0].length)));
      last=match.index+match[0].length;
    }
    if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag,node);
  }
}
async function replaceNprofileMentions(container){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  const tasks=[];
  for(const node of nodes){
    const text=node.textContent;
    const matches=findAllNprofiles(text);
    if(!matches.length) continue;
    const frag=document.createDocumentFragment();
    let lastIndex=0;
    for(const rawToken of matches){
      const index=text.indexOf(rawToken,lastIndex);
      if(index<0) continue;
      if(index>lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex,index)));
      const canonical=rawToken.replace(/^nostr:/i,"");
      const placeholder=document.createElement("span");
      placeholder.className="mention";placeholder.textContent="Loading…";frag.appendChild(placeholder);
      tasks.push((async()=>{
        const pubkey=nprofileToPubkey(canonical);
        const profile=pubkey?await getProfile(pubkey):fallbackProfile("");
        const a=document.createElement("a");
        a.href="https://njump.me/"+canonical;a.target="_blank";a.rel="noopener noreferrer";a.className="mention visible";
        const img=document.createElement("img");img.src=profile.picture;img.alt=profile.name;img.loading="lazy";
        const label=document.createElement("span");label.className="label";label.textContent=profile.name;
        a.append(img,label);
        if(placeholder.isConnected) placeholder.replaceWith(a);
      })());
      lastIndex=index+rawToken.length;
    }
    if(lastIndex<text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    if(node.parentNode) node.parentNode.replaceChild(frag,node);
  }
  await Promise.allSettled(tasks);
}


/* Resolve Nostr indexed profile references (#[n]) in feed posts only.
   Keep the established nprofile renderer untouched because comments use it too. */
async function replaceIndexedProfileMentions(container, sourceEvent){
  const tags=Array.isArray(sourceEvent?.tags)?sourceEvent.tags:[];
  if(!tags.length) return;
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  const tasks=[];
  const pattern=/#\[(\d+)\]/g;
  for(const node of nodes){
    const text=node.textContent;
    const matches=[...text.matchAll(pattern)];
    if(!matches.length) continue;
    const frag=document.createDocumentFragment();
    let lastIndex=0;
    for(const match of matches){
      const rawToken=match[0];
      const tokenIndex=Number(match[1]);
      const tag=tags[tokenIndex];
      const pubkey=tag?.[0]==="p"&&/^[0-9a-f]{64}$/i.test(tag[1]||"")?tag[1].toLowerCase():"";
      if(!pubkey) continue;
      const index=match.index;
      if(index>lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex,index)));
      const placeholder=document.createElement("span");
      placeholder.className="mention";
      placeholder.textContent="Loading…";
      frag.appendChild(placeholder);
      tasks.push((async()=>{
        let profile=fallbackProfile(pubkey);
        try{profile=await getProfile(pubkey)||profile;}catch(error){console.warn("Indexed mention profile lookup failed",error);}
        const labelText=String(profile.name||shortKey(pubkey)||"Nostr user").trim()||shortKey(pubkey)||"Nostr user";
        const a=document.createElement("a");
        let profileId=pubkey;
        try{const {nip19}=await getNostrTools();profileId=nip19.npubEncode(pubkey);}catch{}
        a.href="https://njump.me/"+profileId;
        a.target="_blank";
        a.rel="noopener noreferrer";
        a.className="mention visible";
        const img=document.createElement("img");
        img.src=profile.picture||fallbackProfile(pubkey).picture;
        img.alt=labelText;
        img.loading="lazy";
        const label=document.createElement("span");
        label.className="label";
        label.textContent=labelText;
        a.append(img,label);
        if(placeholder.isConnected) placeholder.replaceWith(a);
      })());
      lastIndex=index+rawToken.length;
    }
    if(lastIndex<text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    if(node.parentNode) node.parentNode.replaceChild(frag,node);
  }
  await Promise.allSettled(tasks);
}

function isReplyEvent(event){
  return (event.tags||[]).some(tag=>tag[0]==="e"&&String(tag[3]||"").toLowerCase()==="reply");
}

async function drawFeed(pageResult){
  if(feedPostObserver){feedPostObserver.disconnect();feedPostObserver=null;}
  feedEl.replaceChildren();

  // Keep the blog artwork above the Nostr posts on every feed refresh.
  const blogBanner=document.createElement("div");
  blogBanner.className="blog-page-banner";
  const blogBannerImage=document.createElement("img");
  blogBannerImage.src="/assets/Blog.gif?v=20261121";
  blogBannerImage.alt="Bitcoin Cats blog";
  blogBannerImage.loading="eager";
  blogBannerImage.decoding="async";
  blogBanner.appendChild(blogBannerImage);
  feedEl.appendChild(blogBanner);
  const events=(pageResult?.events||[]).slice().sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  currentFeedEvents=events.filter(ev=>!isReplyEvent(ev));
  currentFeedPage=1;
  renderedFeedPosts=0;
  feedHasMorePages=Boolean(pageResult?.hasMore);
  feedEventIds=new Set(currentFeedEvents.map(ev=>ev.id).filter(Boolean));
  loadingMoreFeed=false;
  feedLoadMoreContainer=null;
  feedLoadMoreButton=null;
  feedLoadMoreStatus=null;

  if(!currentFeedEvents.length&&!feedHasMorePages){
    feedEl.innerHTML="<p style='color:var(--muted);text-align:center;'>No posts found.</p>";
    overlay.classList.add("hidden");
    return;
  }

  ensureFeedLoadMoreControls();
  await loadMoreFeedPosts({initial:true});
  overlay.classList.add("hidden");
}

function ensureFeedLoadMoreControls(){
  if(feedLoadMoreContainer&&feedLoadMoreContainer.isConnected)return;
  const container=document.createElement("div");
  container.className="feed-load-more";
  const status=document.createElement("p");
  status.className="feed-load-more-status";
  status.setAttribute("role","status");
  status.setAttribute("aria-live","polite");
  status.textContent="Scroll down to load more posts.";
  const button=document.createElement("button");
  button.className="btn";
  button.type="button";
  button.textContent="Load more posts";
  button.onclick=()=>loadMoreFeedPosts();
  container.append(status,button);
  feedLoadMoreContainer=container;
  feedLoadMoreStatus=status;
  feedLoadMoreButton=button;
  feedEl.appendChild(container);
}

function updateFeedLoadMoreControl(message,options={}){
  ensureFeedLoadMoreControls();
  const loading=Boolean(options.loading);
  const retry=Boolean(options.retry);
  const exhausted=!feedHasMorePages&&renderedFeedPosts>=currentFeedEvents.length;
  if(exhausted){
    feedLoadMoreStatus.textContent=renderedFeedPosts?"You've reached the end of the blog.":"No posts found.";
    feedLoadMoreButton.hidden=true;
    feedLoadMoreButton.disabled=false;
    return;
  }
  feedLoadMoreButton.hidden=false;
  feedLoadMoreButton.disabled=loading;
  feedLoadMoreButton.textContent=loading?"Loading more posts…":retry?"Retry loading posts":"Load more posts";
  feedLoadMoreStatus.textContent=message||"Scroll down to load more posts.";
}

async function loadMoreFeedPosts(options={}){
  const initial=Boolean(options.initial);
  if(loadingMoreFeed)return;
  if(!initial&&!feedHasMorePages&&renderedFeedPosts>=currentFeedEvents.length){
    updateFeedLoadMoreControl();
    return;
  }

  loadingMoreFeed=true;
  ensureFeedLoadMoreControls();
  updateFeedLoadMoreControl("Loading posts…",{loading:true});

  try{
    let pagesWithoutNewPosts=0;
    while(renderedFeedPosts>=currentFeedEvents.length&&feedHasMorePages&&pagesWithoutNewPosts<3){
      const requestedPage=currentFeedPage+1;
      const result=await getKind1(PUBKEY_HEX,requestedPage);
      currentFeedPage=requestedPage;
      feedHasMorePages=Boolean(result?.hasMore);
      const nextEvents=(result?.events||[])
        .slice()
        .sort((a,b)=>(b.created_at||0)-(a.created_at||0))
        .filter(ev=>!isReplyEvent(ev));
      let added=0;
      for(const ev of nextEvents){
        if(ev.id&&feedEventIds.has(ev.id))continue;
        if(ev.id)feedEventIds.add(ev.id);
        currentFeedEvents.push(ev);
        added++;
      }
      pagesWithoutNewPosts=added===0?pagesWithoutNewPosts+1:0;
    }

    const batchSize=initial?INITIAL_POSTS_VISIBLE:POSTS_PER_BATCH;
    const batch=currentFeedEvents.slice(renderedFeedPosts,renderedFeedPosts+batchSize);
    if(!batch.length){
      updateFeedLoadMoreControl(
        feedHasMorePages
          ?"No new posts appeared in the last few results. Select “Load more posts” to keep looking."
          :"You've reached the end of the blog."
      );
      return;
    }

    for(const ev of batch){
      await renderPost(ev,renderedFeedPosts);
      renderedFeedPosts++;
    }
    setupFadeIn();
    updateFeedLoadMoreControl("Scroll down to load more posts.");
  }catch(error){
    console.error("Could not load more blog posts",error);
    updateFeedLoadMoreControl("Couldn't load more posts. Check your connection and try again.",{retry:true});
  }finally{
    loadingMoreFeed=false;
    if(feedLoadMoreButton&&feedLoadMoreButton.textContent==="Loading more posts…"){
      updateFeedLoadMoreControl();
    }
  }
}


function maybeLoadMoreFeedOnScroll(){
  if(window.scrollY<=0||loadingMoreFeed||!feedLoadMoreContainer||!feedLoadMoreContainer.isConnected||!feedLoadMoreButton||feedLoadMoreButton.hidden)return;
  const bounds=feedLoadMoreContainer.getBoundingClientRect();
  if(bounds.top<window.innerHeight+180&&bounds.bottom>0){
    loadMoreFeedPosts();
  }
}
window.addEventListener("scroll",maybeLoadMoreFeedOnScroll,{passive:true});

async function renderPost(ev,renderedPostIndex){

  const header=document.createElement("div");

  const pfp=document.createElement("img");

  const metaDiv=document.createElement("div");

  content.textContent=textOnly;
  await replaceNprofileMentions(content);
  await replaceIndexedProfileMentions(content,ev);
  linkifyRemainingTextNodes(content);

  const gallery=document.createElement("div");
  gallery.className="gallery";
  const imgs=extractImages(ev.content||"");
  const vids=extractVideos(ev.content||"");
  const lives=extractLive(ev.content||"");
  imgs.forEach(u=>gallery.appendChild(mediaBoxForImage(u)));
  vids.forEach(u=>gallery.appendChild(mediaBoxForVideo(u)));
  lives.forEach(u=>gallery.appendChild(mediaBoxForLive(u)));
  if(gallery.childNodes.length===1)gallery.classList.add("single");

  post.appendChild(header);
  post.appendChild(content);
  if(gallery.childNodes.length)post.appendChild(gallery);

  const nevent=findNevent(ev.content||"");
  if(nevent){
    const idHex=neventToId(nevent);
    if(idHex){
      try{
        const quoted=await getNoteById(idHex);
        if(quoted){
          const qProfile=await getProfile(quoted.pubkey);
          const quoteDiv=document.createElement("div");
          quoteDiv.className="quote";
          const qh=document.createElement("div");
          qh.className="quote-header";
          const qp=document.createElement("img");
          qp.src=qProfile.picture;
          qp.alt="Quoted Nostr profile";
          qp.loading="lazy";
          qp.decoding="async";
          const qname=document.createElement("div");
          qname.className="quote-name";
          qname.textContent=qProfile.name;
          qh.appendChild(qp);
          qh.appendChild(qname);
          const qt=document.createElement("div");
          qt.className="quote-text";
          qt.textContent=(quoted.content||"").slice(0,500);
          quoteDiv.appendChild(qh);
          quoteDiv.appendChild(qt);
          post.appendChild(quoteDiv);
        }
      }catch(e){console.warn("Failed to render nevent quote",e);}
    }
  }

  attachInteractions(post,ev);
  feedEl.insertBefore(post,feedLoadMoreContainer||null);
}

function setupFadeIn(){
  if(typeof IntersectionObserver==="undefined"){
    feedEl.querySelectorAll(".post").forEach(el=>el.classList.add("visible"));
    return;
  }
  if(!feedPostObserver){
    feedPostObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting)entry.target.classList.add("visible");
        else entry.target.classList.remove("visible");
      });
    },{threshold:0.2});
  }
  feedEl.querySelectorAll(".post:not(.feed-observed)").forEach(el=>{
    el.classList.add("feed-observed");
    feedPostObserver.observe(el);
  });
}

function updateNavigationState(page=activeContentPage){
  const items=[["home","homeBtn"],["about","aboutBtn"],["live","liveBtn"],["donation","zapBtn"]];
  for(const [key,id] of items){

function setPageHistory(page,{replace=false}={}){
  const url=page==="donation"?"/donation/":page==="about"?"/?page=about":"/";
  const state={page};
  if(replace){
    history.replaceState(state,"",url);
  }else if((location.pathname+location.search+location.hash)!==url || history.state?.page!==page){
    history.pushState(state,"",url);
  }
  activeContentPage=page;
  updateNavigationState(page);
}

/* About page */
async function fetchAboutPageMarkup(){
  // about.html sets a Jekyll permalink to /about, so try the generated
  // permalink first. Fall back to the source filename for non-Jekyll hosts.
  const candidates=["/about","/about/","/about.html"];
  let lastError=null;
  for(const path of candidates){
    try{
      const url=new URL(path,window.location.origin);
      url.searchParams.set("_",String(Date.now()));
      const response=await fetch(url.href,{mode:"same-origin",cache:"no-store"});
      if(!response.ok)continue;
      const html=await response.text();
      // A SPA fallback may return index.html with a 200 status. Accept only
      // the actual About document, not the shell page.
      if(html.includes('class="about-wrapper"')&&html.includes("Our Services"))return html;
    }catch(error){lastError=error;}
  }
  throw lastError||new Error("Could not load the About page from /about or about.html.");
}

let nostrIframeSignerActive = false;
let loginFrameReady = false;
const pendingLoginSignatures = new Map();
const SHARED_AUTH_KEY="bitcoinCatsAuth";
function hexBytes(hex){return Uint8Array.from((hex.match(/.{2}/g)||[]).map(value=>parseInt(value,16)));}
function postToLoginFrame(message){
  const frame=document.getElementById("nostrLoginFrame");
  if(frame?.contentWindow)frame.contentWindow.postMessage(message,location.origin);
}
function dismissNostrLoginModal({notifyFrame=true}={}){
  const modal=document.getElementById("nostrLoginModal");
  if(!modal)return;
  modal.hidden=true;
  document.body.style.overflow="";
  if(notifyFrame&&!nostrIframeSignerActive&&loginFrameReady)postToLoginFrame({type:"bitcoin-cats-close-login"});
}
function openNostrLoginModal(){
  const modal=document.getElementById("nostrLoginModal");
  const frame=document.getElementById("nostrLoginFrame");
  if(!modal||!frame)return;
  modal.hidden=false;
  document.body.style.overflow="hidden";
  const frameUrl="/live.html?login=1&embed=1";
  if(frame.getAttribute("src")!==frameUrl){
    loginFrameReady=false;
    frame.setAttribute("src",frameUrl);
  }else if(loginFrameReady){
    postToLoginFrame({type:"bitcoin-cats-open-login"});
  }
}
async function showAccountFloat(profile={}){
  const box=document.getElementById("accountFloat");if(!box)return;
  document.getElementById("accountFloatName").textContent=String(profile.name||"Nostr user").trim()||"Nostr user";
  try{const {nip19}=await getNostrTools();document.getElementById("accountFloatId").textContent=nip19.npubEncode(signedInPubkey);}catch{document.getElementById("accountFloatId").textContent=npubShort(signedInPubkey);}
  const avatar=document.getElementById("accountFloatAvatar");avatar.onerror=()=>{avatar.onerror=null;avatar.src="/logo.png";};
  avatar.src=/^https:\/\//i.test(profile.picture||"")?profile.picture:"/logo.png";box.classList.add("visible");document.body.classList.add("has-account");
}
function openProfileSettings(){
  const modal=document.getElementById("nostrLoginModal"),frame=document.getElementById("nostrLoginFrame");
  modal.hidden=false;document.body.style.overflow="hidden";const frameUrl="/live.html?login=1&embed=1";
  if(frame.getAttribute("src")!==frameUrl){loginFrameReady=false;frame.setAttribute("src",frameUrl);frame.addEventListener("load",()=>{if(loginFrameReady)postToLoginFrame({type:"bitcoin-cats-open-settings"});},{once:true});}
  else if(loginFrameReady)postToLoginFrame({type:"bitcoin-cats-open-settings"});
}
function signWithLoginFrame(unsignedEvent){
  if(!nostrIframeSignerActive) return Promise.reject(new Error("The sign-in window is no longer available. Please sign in again."));
  const requestId="sig-"+Date.now()+"-"+Math.random().toString(36).slice(2);
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{
      pendingLoginSignatures.delete(requestId);
      reject(new Error("The Nostr signer did not respond. Please try again."));
    },90000);
    pendingLoginSignatures.set(requestId,{resolve,reject,timer});
    postToLoginFrame({type:"bitcoin-cats-sign-event",requestId,event:unsignedEvent});
  });
}
const nostrLoginFrame=document.getElementById("nostrLoginFrame");
nostrLoginFrame.addEventListener("load",()=>{
  loginFrameReady=true;
  if(nostrLoginFrame.getAttribute("src")==="/live.html?login=1&embed=1"){
    if(document.getElementById("nostrLoginModal").hidden)postToLoginFrame({type:"bitcoin-cats-close-login"});
    else postToLoginFrame({type:"bitcoin-cats-open-login"});
  }
});
document.getElementById("nostrLoginModal").addEventListener("click",event=>{
  if(event.target===event.currentTarget)dismissNostrLoginModal();
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!document.getElementById("nostrLoginModal").hidden)dismissNostrLoginModal();
});
window.addEventListener("message",event=>{
  if(event.origin!==location.origin||event.source!==nostrLoginFrame.contentWindow)return;
  const message=event.data||{};
  if(message.type==="bitcoin-cats-login-complete"){
    if(!/^[0-9a-f]{64}$/.test(message.pubkey||""))return;
    signedInPubkey=message.pubkey;
    nostrIframeSignerActive=true;
    if(nostrRemoteSigner&&typeof nostrRemoteSigner.close==="function")void nostrRemoteSigner.close().catch(()=>{});
    nostrRemoteSigner=null;
    const profile=message.profile||{};
    showAccountFloat(profile);
    document.getElementById("loginBtn").textContent="✓ "+(profile.name||npubShort(signedInPubkey));
    document.querySelectorAll(".comment-input").forEach(el=>el.placeholder="Write a reply…");
    dismissNostrLoginModal({notifyFrame:false});
  }else if(message.type==="bitcoin-cats-profile-updated"){
    if(message.pubkey!==signedInPubkey)return;
    showAccountFloat(message.profile||{});
    dismissNostrLoginModal({notifyFrame:false});
    document.getElementById("loginBtn").textContent="✓ "+((message.profile||{}).name||npubShort(signedInPubkey));
  }else if(message.type==="bitcoin-cats-request-profile-setup"){
    openProfileSettings();
  }else if(message.type==="bitcoin-cats-login-dismiss"){
    if(!nostrIframeSignerActive)dismissNostrLoginModal({notifyFrame:false});
  }else if(message.type==="bitcoin-cats-sign-result"){
    const pending=pendingLoginSignatures.get(message.requestId);
    if(!pending)return;
    clearTimeout(pending.timer);
    pendingLoginSignatures.delete(message.requestId);
    if(message.ok&&message.event&&message.event.pubkey===signedInPubkey)pending.resolve(message.event);
    else pending.reject(new Error(message.error||"The Nostr signer returned an invalid event."));
  }
});
async function restoreSharedNostrSession(){
  let saved;
  try{saved=JSON.parse(sessionStorage.getItem(SHARED_AUTH_KEY)||"null");}catch{}
  if(!saved||!/^([0-9a-f]{64})$/.test(saved.pubkey||""))return;
  try{
    if(saved.method==="nip46"&&/^[0-9a-f]{64}$/.test(saved.remoteSecret||"")&&(saved.bunkerPointer||saved.remoteUri)){
      const [nip46,{SimplePool}]=await Promise.all([import("https://esm.sh/nostr-tools@2.10.4/nip46?bundle"),getNostrTools()]);
      nostrPool ||= new SimplePool();
      const clientSecret=hexBytes(saved.remoteSecret);
      if(saved.bunkerPointer&&/^[0-9a-f]{64}$/i.test(saved.bunkerPointer.pubkey||"")&&Array.isArray(saved.bunkerPointer.relays)&&saved.bunkerPointer.relays.length){
        nostrRemoteSigner=nip46.BunkerSigner.fromBunker(clientSecret,{pubkey:saved.bunkerPointer.pubkey,relays:saved.bunkerPointer.relays},{pool:nostrPool});
        await nostrRemoteSigner.connect();
      }else{
        nostrRemoteSigner=await nip46.BunkerSigner.fromURI(clientSecret,saved.remoteUri,{pool:nostrPool},20000);
      }
      signedInPubkey=await nostrRemoteSigner.getPublicKey();
    }else if(saved.method==="nip07"&&window.nostr&&typeof window.nostr.getPublicKey==="function"&&typeof window.nostr.signEvent==="function"){
      const pubkey=await window.nostr.getPublicKey();
      if(pubkey===saved.pubkey)signedInPubkey=pubkey;
    }
    if(signedInPubkey){
      const profile=await getProfile(signedInPubkey);
      showAccountFloat(profile);
      document.getElementById("loginBtn").textContent="✓ "+(profile.name||npubShort(signedInPubkey));
      document.querySelectorAll(".comment-input").forEach(el=>el.placeholder="Write a reply…");
    }
  }catch(error){
    console.warn("Could not restore the shared Nostr signer session",error);
    nostrRemoteSigner=null;signedInPubkey=null;
  }
}
const reactionEmoji = ["❤️","🔥","😂","😻","🚀","💜"];

async function getNostrTools(){
  if(!nostrTools) nostrTools = await import("https://esm.sh/nostr-tools@2.10.4");
  return nostrTools;
}
function npubShort(hex){return hex ? hex.slice(0,8)+"…"+hex.slice(-4) : "";}
async function connectNostr(){
  if(signedInPubkey){
    if(nostrIframeSignerActive)postToLoginFrame({type:"bitcoin-cats-sign-out"});
    nostrIframeSignerActive=false;
    signedInPubkey=null;
    if(nostrRemoteSigner&&typeof nostrRemoteSigner.close==="function")void nostrRemoteSigner.close().catch(()=>{});
    nostrRemoteSigner=null;
    try{sessionStorage.removeItem(SHARED_AUTH_KEY);sessionStorage.removeItem("bitcoinCatsLoginReturn");}catch{}
    document.getElementById("accountFloat").classList.remove("visible");
    document.body.classList.remove("has-account");
    document.getElementById("loginBtn").textContent="🔑 Login with Nostr";
    document.querySelectorAll(".comment-input").forEach(el=>el.placeholder="Sign in to write a reply…");
    return;
  }
  openNostrLoginModal();
}
async function publishNostrEvent(event){
  if(!signedInPubkey) throw new Error("Please log in with your Nostr signer first.");
  let signed=null;
  if(nostrIframeSignerActive)signed=await signWithLoginFrame(event);
  else if(nostrRemoteSigner)signed=await nostrRemoteSigner.signEvent(event);
  else if(window.nostr&&typeof window.nostr.signEvent==="function")signed=await window.nostr.signEvent(event);
  if(!signed||signed.pubkey!==signedInPubkey)throw new Error("Your Nostr signer is unavailable or returned an event for a different account. Please sign in again.");
  const {SimplePool} = await getNostrTools();
  if(!nostrPool) nostrPool = new SimplePool();
  const results = await Promise.allSettled(nostrPool.publish(WRITE_RELAYS,signed));
  if(!results.some(r=>r.status==="fulfilled")) throw new Error("Your signer signed the event, but no relay confirmed publishing. Try again.");
  return signed;
}
async function publishReaction(note, emoji){
  if(!signedInPubkey){await connectNostr();if(!signedInPubkey)return;}
  const event = {kind:7,created_at:Math.floor(Date.now()/1000),tags:[["e",note.id],["p",note.pubkey]],content:emoji};
  await publishNostrEvent(event);
}
async function publishComment(note, text){
  if(!signedInPubkey){await connectNostr();if(!signedInPubkey)return;}
  const event = {kind:1,created_at:Math.floor(Date.now()/1000),tags:[["e",note.id,"","reply"],["p",note.pubkey]],content:text};
  await publishNostrEvent(event);
}
async function loadNoteInteractions(note, container){
  const list = container.querySelector(".comment-list");
  const stats = container.querySelector(".interaction-stats");
  try{
    const {SimplePool} = await getNostrTools();
    if(!nostrPool) nostrPool = new SimplePool();
    const events = await Promise.race([
      nostrPool.querySync(WRITE_RELAYS,{kinds:[1,7],"#e":[note.id],limit:100}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),9000))
    ]);
    const replies = events.filter(e=>e.kind===1 && (e.tags||[]).some(t=>t[0]==="e"&&t[1]===note.id));
    const reactions = events.filter(e=>e.kind===7);
    stats.textContent = replies.length + " replies · " + reactions.length + " reactions";
    list.replaceChildren();
    for(const reply of replies.sort((a,b)=>a.created_at-b.created_at).slice(-12)){
      const item=document.createElement("div");item.className="comment-item";
      const authorRow=document.createElement("div");authorRow.className="comment-author-row";
      const authorPic=document.createElement("img");authorPic.className="comment-pfp";authorPic.alt="Nostr profile";authorPic.loading="lazy";authorPic.src=fallbackProfile(reply.pubkey).picture;
      const author=document.createElement("div");author.className="comment-author";author.textContent="Loading profile…";
      authorRow.append(authorPic,author);
      const body=document.createElement("div");body.className="comment-body";body.textContent=normalizeNprofileMarkup(reply.content);
      item.append(authorRow,body);list.appendChild(item);
      getProfile(reply.pubkey).then(profile=>{
        author.textContent=profile.name || shortKey(reply.pubkey);
        authorPic.src=profile.picture || ("https://api.dicebear.com/7.x/identicon/svg?seed="+reply.pubkey);
        authorPic.alt=profile.name || "Nostr profile";
      }).catch(()=>{
        author.textContent=shortKey(reply.pubkey);
        authorPic.src="https://api.dicebear.com/7.x/identicon/svg?seed="+reply.pubkey;
      });
      await replaceNprofileMentions(body);
      linkifyRemainingTextNodes(body);
    }
  }catch(error){stats.textContent="Replies and reactions load when relays respond.";}
}
function attachInteractions(post, note){
  const actions=document.createElement("div");actions.className="post-actions";
  const like=document.createElement("button");like.className="post-action";like.type="button";like.textContent="❤️ Like";
  like.onclick=async()=>{like.disabled=true;try{await publishReaction(note,"❤️");like.classList.add("active");like.textContent="❤️ Liked";}catch(e){alert(e.message||"Could not publish reaction.");}finally{like.disabled=false;}};
  actions.appendChild(like);
  reactionEmoji.filter(e=>e!=="❤️").forEach(emoji=>{
    const btn=document.createElement("button");btn.className="post-action";btn.type="button";btn.textContent=emoji;btn.title="React "+emoji;
    btn.onclick=async()=>{btn.disabled=true;try{await publishReaction(note,emoji);btn.classList.add("active");}catch(e){alert(e.message||"Could not publish reaction.");}finally{btn.disabled=false;}};
    actions.appendChild(btn);
  });
  const commentJump=document.createElement("button");commentJump.className="post-action";commentJump.type="button";commentJump.textContent="💬 Comment";
  actions.appendChild(commentJump);
  post.appendChild(actions);

  const interactions=document.createElement("section");interactions.className="post-interactions";
  const stats=document.createElement("div");stats.className="interaction-note interaction-stats";stats.textContent="Loading replies and reactions…";
  const list=document.createElement("div");list.className="comment-list";
  const form=document.createElement("form");form.className="comment-form";
  const input=document.createElement("input");input.className="comment-input";input.type="text";input.maxLength=2000;input.placeholder="Sign in to write a reply…";input.setAttribute("aria-label","Write a comment");
  const submit=document.createElement("button");submit.className="btn primary";submit.type="submit";submit.textContent="Reply";
  form.append(input,submit);
  const noteLine=document.createElement("div");noteLine.className="interaction-note";noteLine.textContent="Reactions and replies are public Nostr events. A NIP-07 signer is required to publish.";
  form.onsubmit=async e=>{
    e.preventDefault();const text=input.value.trim();if(!text)return;
    submit.disabled=true;
    try{await publishComment(note,text);input.value="";noteLine.textContent="Reply published to Nostr relays.";await loadNoteInteractions(note,interactions);}
    catch(error){noteLine.textContent=error.message||"Could not publish reply.";}
    finally{submit.disabled=false;}
  };
  commentJump.onclick=()=>{input.focus();interactions.scrollIntoView({behavior:"smooth",block:"nearest"});};
  interactions.append(stats,list,form,noteLine);post.appendChild(interactions);
  loadNoteInteractions(note,interactions);
}

/* ---------- Boot ---------- */
async function load(){
  try{
    const initialDonationRoute=isDonationRoute();
    const initialAboutRoute=!initialDonationRoute&&isAboutRoute();
    const [firstPage,meta]=await Promise.all([
      (initialDonationRoute||initialAboutRoute)?Promise.resolve([]):getKind1(PUBKEY_HEX,1),
      getProfile(PUBKEY_HEX)
    ]);
    applyProfileToBanner(meta);
    await restoreSharedNostrSession();
    const initialPage=initialDonationRoute?"donation":initialAboutRoute?"about":"home";
    setPageHistory(initialPage,{replace:true});
    if(initialDonationRoute){
      await showDonationPage({navigate:false,profile:meta});
    }else if(initialAboutRoute){
      await showAbout({navigate:false});
    }else{
      activeContentPage="home";
      updateNavigationState("home");
      await drawFeed(firstPage);
    }

    // Button wiring
    document.getElementById("loginBtn").onclick=connectNostr;
    document.getElementById("homeBtn").onclick=()=>showHomePage();
    document.getElementById("aboutBtn").onclick=()=>showAbout();
    document.getElementById("liveBtn").onclick=()=>{window.location.assign("/live");};
    document.getElementById("zapBtn").onclick=()=>showDonationPage();

    // Keep browser Back/Forward synchronized with the visible page.
    window.addEventListener("popstate",(event)=>{
      const page=event.state?.page || (isDonationRoute()?"donation":isAboutRoute()?"about":"home");
      if(page==="donation")void showDonationPage({navigate:false});
      else if(page==="about")void showAbout({navigate:false});
      else void showHomePage({navigate:false});
    });
  }catch(e){
    console.error(e);
    feedEl.innerHTML="<p style='color:#f77;text-align:center;'>Error loading posts.</p>";
  }finally{
    overlay.classList.add("hidden");
  }
}

document.getElementById("accountSettingsButton").addEventListener("click",openProfileSettings);
document.getElementById("accountSignOutButton").addEventListener("click",()=>void connectNostr());
document.addEventListener("DOMContentLoaded",load,{once:true});
</script>
