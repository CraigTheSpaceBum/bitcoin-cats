name: Platform viewer Worker checks

on:
  push:
    branches: ["main"]
    paths:
      - "live.html"
      - "workers/platform-viewers/**"
      - ".github/workflows/platform-viewers-worker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "live.html"
      - "workers/platform-viewers/**"
      - ".github/workflows/platform-viewers-worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/platform-viewers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Test Worker endpoint behaviour
        run: npm test
